query Restaurants($region: String!, $sinceDate: AWSDateTime, $dates: [AWSDate], $page: Int!) {
  restaurants(region: $region, sinceDate: $sinceDate, dates: $dates, page: $page) {
    __typename
    restaurants {
      __typename
      objectId
      created
      lastUpdated
      enabled
      region
      name
      address1
      address2
      city
      postcode
      phone
      businessDescription
      bioLink
      hood
      latitude
      longitude
      hours
      imageLink
      otherImages
      markerCuisine
      menuPhotos
      pdfMenu
      cuisines
      numRatings
      averageRating
      offersDineIn
      offersTakeaway
      offersIAO
      subsidyEnabled
      ecPayEnabled
      tags
      foodLabels
      diningType
      coverCharge
      isNew
      promo
      custTransFeeMap
      menuVersion
      fulfillCode
      typicalEta
      lastOrderBuffer
      recentDeals
      topDeals
      premiumBoost
      premiumBoostListLabel
      premiumBoostDescription
      maxDiscount
      state
      offersTableOrdering
      offersDelivery
      cost
      zoneId
      currencyCode
      excludedItemCount
      dineInPOSVersion
      sellsOutEarly
      cashbackProgram
      offerlessEnabled
      venueTypes
    }
    nextPage
  }
}
