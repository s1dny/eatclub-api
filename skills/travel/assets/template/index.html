<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trip map</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font:
          14px system-ui,
          sans-serif;
      }
      body {
        display: flex;
      }
      #map {
        flex: 1;
      }
      #card {
        width: 400px;
        overflow-y: auto;
        display: none;
      }
      #card.open {
        display: block;
      }
      #legend {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        background: #fff;
        border-radius: 10px;
        padding: 8px 12px;
        box-shadow: 0 2px 8px #0004;
      }
      #legend div {
        cursor: pointer;
        padding: 3px 0;
      }
      #legend small {
        display: block;
        margin-left: 20px;
        color: #555;
      }
      #legend i {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
        vertical-align: -1px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <aside id="card"></aside>
    <div id="legend"></div>
    <script type="module" src="./map.ts"></script>
  </body>
</html>
