<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; font: 14px/1.4 system-ui, sans-serif; color: #e5e7eb; background: #14171b; }
      #panel { width: 320px; flex: none; overflow-y: auto; padding: 16px; box-sizing: border-box; }
      #map { flex: 1; }
      h1 { margin: 0 0 4px; font-size: 18px; }
      #status { margin: 0 0 16px; color: #9ca3af; }
      #status[role="alert"] { color: #fca5a5; }
      .card { padding: 12px; margin-bottom: 10px; border-radius: 10px; background: #1f2329; cursor: pointer; }
      .card h2 { margin: 0 0 8px; padding-left: 8px; border-left: 4px solid; font-size: 15px; }
      .card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
      .card dt { color: #9ca3af; }
      .card dd { margin: 0; }
      .card a { display: inline-block; margin-top: 8px; color: #93c5fd; }
      .gm-style .card { background: none; color: #111; cursor: default; padding: 0; margin: 0; }
      .gm-style .card dt { color: #555; }
      .gm-style .card a { color: #1d4ed8; }
      @media (max-width: 700px) { body { flex-direction: column-reverse; } #panel { width: auto; height: 40%; } }
    </style>
  </head>
  <body>
    <aside id="panel">
      <h1>Map</h1>
      <p id="status" role="status">Loading map…</p>
      <div id="list"></div>
    </aside>
    <div id="map" aria-label="Satellite map"></div>
    <script type="module" src="./map.ts"></script>
  </body>
</html>
